<!doctype html>
<!--
  smoke-test.html
  ------------------------------------------------------------------
  Standalone widget that does nothing but verify the openLink
  round-trip. Serve this as your MCP App's UI resource, then trigger
  it in Claude Desktop.

  Expected behaviour:
    - Page renders with one "Test open link" button.
    - Clicking it shows Claude's "Open external link" modal.
    - Clicking "Open link" -> alert("user confirmed").
    - Clicking "Cancel"    -> alert("cancelled: ...").

  If the modal never appears, the handshake didn't complete. Open
  Claude Desktop's dev tools and look for
  "[widget] ui/initialize failed" in the console.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>openLink smoke test</title>
  <script>
  (() => {
    const PROTOCOL = "2026-01-26";
    let nextId = 1;
    const pending = new Map();
    let hostCapabilities = null;

    const send = (msg) => window.parent.postMessage(msg, "*");

    const rpc = (method, params, timeoutMs = 15000) =>
      new Promise((resolve, reject) => {
        const id = nextId++;
        const timer = setTimeout(() => {
          if (pending.has(id)) { pending.delete(id); reject(new Error(method + " timeout")); }
        }, timeoutMs);
        pending.set(id, {
          resolve: (v) => { clearTimeout(timer); resolve(v); },
          reject:  (e) => { clearTimeout(timer); reject(e);  },
        });
        send({ jsonrpc: "2.0", id, method, params });
      });

    window.addEventListener("message", (e) => {
      const m = e.data;
      if (m && typeof m.id === "number" && pending.has(m.id)) {
        const p = pending.get(m.id); pending.delete(m.id);
        m.error ? p.reject(m.error) : p.resolve(m.result);
      }
    });

    (async () => {
      try {
        const init = await rpc("ui/initialize", {
          protocolVersion: PROTOCOL,
          appInfo: { name: "openlink-smoke-test", version: "0.1.0" },
          appCapabilities: {},
        }, 2000);
        hostCapabilities = init?.hostCapabilities ?? null;
        send({ jsonrpc: "2.0", method: "ui/notifications/initialized" });
        send({ type: "ui-lifecycle-iframe-ready" });
      } catch (err) {
        console.error("[widget] ui/initialize failed:", err);
      }
    })();

    window.openLink = (url) => {
      if (hostCapabilities && !hostCapabilities.openLinks) {
        console.warn("[widget] host did not advertise openLinks capability");
      }
      return rpc("ui/openLink", { url }, 60000);
    };
  })();
  </script>
</head>
<body style="font-family: system-ui; padding: 24px;">
  <h2>openLink smoke test</h2>
  <button onclick="window.openLink('https://example.com').then(
    () => alert('user confirmed'),
    (e) => alert('cancelled: ' + (e && e.message ? e.message : e))
  )" style="padding: 8px 16px; font-size: 14px;">
    Test open link
  </button>
</body>
</html>
